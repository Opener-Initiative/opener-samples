CONFIG_KERNEL_BIN_NAME="sample-dectnrp"
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="sample-dectnrp"

#Enable thread awareness for debugging tools supporting it
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_ASSERT=y

CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# Kernel options
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_HWINFO=y
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y

CONFIG_DECTNRP_DRIVER_NRF91X1=y
CONFIG_DECTNRP_DRIVER_NRF91X1_CAP_LOGGING=n
CONFIG_DECTNRP_DRIVER_SCHEDULED_API=y
CONFIG_DECTNRP_DRIVER_BLOCKING_API=n

CONFIG_SAMPLE_DECTNRP_LOG_LEVEL_DBG=n
CONFIG_SAMPLE_DECTNRP_LOG_LEVEL_INF=y

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_LOG=y

# DECTNRP L2 layer settings
CONFIG_NET_L2_DECTNRP=y
CONFIG_NET_L2_DECTNRP_LOG_LEVEL_ERR=n
CONFIG_NET_L2_DECTNRP_LOG_LEVEL_WRN=n
CONFIG_NET_L2_DECTNRP_LOG_LEVEL_INF=n
CONFIG_NET_L2_DECTNRP_LOG_LEVEL_DBG=y

