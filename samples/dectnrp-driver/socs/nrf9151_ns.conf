# Settings for all nRF9151 boards (non-secure): modem library with the
# DECT NR+ PHY firmware and the nRF91x1 driver.

CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
# Required by the nRF91x1 driver (depends on !MODEM_ANTENNA); enabled by
# default on some Nordic kits (e.g., nrf9151dk)
CONFIG_MODEM_ANTENNA=n

CONFIG_DECTNRP_DRIVER_NRF91X1=y
CONFIG_DECTNRP_DRIVER_NRF91X1_CAP_LOGGING=n

CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
